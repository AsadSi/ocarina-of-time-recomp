# Custom symbols used for patches.
[[section]]
name = "ABSOLUTE_SYMS"
vram = 0x00000000
size = 0x0

symbols = [
    # Unrelocated addresses of game state init functions. The game finds a game state's overlay by
    # comparing this address against its overlay table, so patches must not have it relocated.
    { name = "ConsoleLogo_Init_NORELOCATE", vram = 0x808007B0 },
    { name = "MapSelect_Init_NORELOCATE", vram = 0x80801C14 },
]
