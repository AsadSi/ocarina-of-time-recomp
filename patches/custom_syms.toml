# Custom symbols used for patches.
[[section]]
name = "ABSOLUTE_SYMS"
vram = 0x00000000
size = 0x0

symbols = [
    # Unrelocated addresses of game state init functions. The game finds a game state's overlay by
    # comparing this address against its overlay table, so patches must not have it relocated.
    { name = "ConsoleLogo_Init_NORELOCATE", vram = 0x808007B0 },
    { name = "MapSelect_Init_NORELOCATE", vram = 0x80801C14 },
    # File statics of z_parameter.c (the magic meter's border color), which have no symbols. Found from the
    # relocations in Magic_Update: z_parameter.o's .data + 0x1B8/0x1BC/0x1C0.
    { name = "sMagicBorderR", vram = 0x800F5498 },
    { name = "sMagicBorderG", vram = 0x800F549C },
    { name = "sMagicBorderB", vram = 0x800F54A0 },
]
