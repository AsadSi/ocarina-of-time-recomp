[manifest]
id = "oot_faster_text"
version = "1.0.0"
display_name = "Faster Text"
description = """
Text boxes print each page at once instead of letter by letter. You still press A to go to the next page. \
Text the game marks as unskippable keeps its original speed."""
short_description = "Each page of text appears at once."
authors = [ "asadsi" ]
game_id = "oot"
minimum_recomp_version = "1.2.2"
dependencies = []
optional_dependencies = []
native_libraries = []

[inputs]
elf_path = "build/mod.elf"
mod_filename = "oot_faster_text"
func_reference_syms_file = "../../OoTRecompSyms/oot.pal-1.1.syms.toml"
data_reference_syms_files = [ "../../OoTRecompSyms/oot.pal-1.1.datasyms.toml" ]
additional_files = []
